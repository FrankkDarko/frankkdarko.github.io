<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frankk Darko</title>
  <meta name="description" content="Frankk Darko — créateur d'outils web gratuits, passionné de VRChat, de mondes virtuels et de jeux vidéo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2314b8a6'/%3E%3Cstop offset='1' stop-color='%230284c7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='30' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3EFD%3C/text%3E%3C/svg%3E">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1120;
      --bg-soft: #101830;
      --card: #131c36;
      --card-border: #22305a;
      --text: #e6ecf8;
      --muted: #93a3c4;
      --accent: #14b8a6;
      --accent-2: #0ea5e9;
      --grad: linear-gradient(135deg, #14b8a6, #0284c7);
      --radius: 18px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }
    /* glow décoratif */
    .glow {
      position: fixed;
      width: 60vw; height: 60vw;
      max-width: 800px; max-height: 800px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .14;
      pointer-events: none;
      z-index: 0;
    }
    .glow-1 { background: #14b8a6; top: -20vw; right: -20vw; }
    .glow-2 { background: #0284c7; bottom: -25vw; left: -20vw; }

    .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 24px; }

    /* ---------- topbar ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .logo { width: 42px; height: 42px; border-radius: 12px; }
    .brand strong { font-size: 1.05rem; font-weight: 800; letter-spacing: .2px; }
    .lang-switch { display: flex; gap: 6px; }
    .lang-btn {
      background: transparent; color: var(--muted);
      border: 1px solid var(--card-border); border-radius: 10px;
      padding: 6px 12px; font: inherit; font-weight: 600; font-size: .85rem;
      cursor: pointer; transition: .2s;
    }
    .lang-btn:hover { color: var(--text); border-color: var(--accent); }
    .lang-btn.active { background: var(--grad); color: #fff; border-color: transparent; }

    /* ---------- hero ---------- */
    .hero { text-align: center; padding: 72px 0 64px; }
    .hero .biglogo {
      width: 108px; height: 108px; border-radius: 28px;
      box-shadow: 0 12px 48px rgba(20, 184, 166, .35);
      margin-bottom: 28px;
    }
    .hero h1 {
      font-size: clamp(2.2rem, 6vw, 3.6rem);
      font-weight: 900; letter-spacing: -1px; line-height: 1.15;
    }
    .hero h1 span {
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero .sub {
      max-width: 620px; margin: 18px auto 0;
      color: var(--muted); font-size: 1.08rem;
    }
    .hero .cta { margin-top: 34px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-radius: 12px;
      font-weight: 700; font-size: .95rem; text-decoration: none;
      transition: .2s;
    }
    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 6px 24px rgba(14, 165, 233, .3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(14, 165, 233, .45); }
    .btn-ghost { border: 1px solid var(--card-border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ---------- sections ---------- */
    section { padding: 56px 0; }
    .sec-title { font-size: 1.7rem; font-weight: 800; margin-bottom: 8px; }
    .sec-sub { color: var(--muted); margin-bottom: 32px; max-width: 640px; }

    .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 26px;
      transition: .25s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-3px); }
    .card .icon {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      background: var(--bg-soft);
      border: 1px solid var(--card-border);
      margin-bottom: 16px;
    }
    .card h3 { font-size: 1.12rem; font-weight: 700; margin-bottom: 8px; }
    .card p { color: var(--muted); font-size: .95rem; }

    /* ---------- tools ---------- */
    .tool-card { display: flex; flex-direction: column; }
    .tool-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .tool-head svg { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; }
    .tool-head h3 { font-size: 1.1rem; font-weight: 800; }
    .tool-card p { flex: 1; }
    .tool-links { display: flex; gap: 10px; margin-top: 20px; }
    .tool-links a {
      flex: 1; text-align: center; text-decoration: none;
      padding: 9px 0; border-radius: 10px; font-weight: 700; font-size: .88rem;
      transition: .2s;
    }
    .t-open { background: var(--grad); color: #fff; }
    .t-open:hover { filter: brightness(1.12); }
    .t-code { border: 1px solid var(--card-border); color: var(--muted); }
    .t-code:hover { color: var(--accent); border-color: var(--accent); }

    /* ---------- footer ---------- */
    footer {
      border-top: 1px solid var(--card-border);
      margin-top: 40px; padding: 36px 0 48px;
      text-align: center;
    }
    .socials { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
    .socials a {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--text); text-decoration: none; font-weight: 600; font-size: .92rem;
      padding: 10px 18px; border: 1px solid var(--card-border); border-radius: 12px;
      transition: .2s;
    }
    .socials a:hover { border-color: var(--accent); color: var(--accent); }
    .socials svg { width: 18px; height: 18px; fill: currentColor; }
    footer .copy { color: var(--muted); font-size: .85rem; }

    @media (max-width: 560px) {
      .hero { padding: 48px 0 40px; }
      section { padding: 40px 0; }
    }
  </style>
</head>

    function setLang(lang) {
      const dict = I18N[lang] || I18N.en;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.textContent = dict[key];
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.getAttribute('data-i18n-html');
        if (dict[key]) el.innerHTML = dict[key];
      });
      document.getElementById('lang-fr').classList.toggle('active', lang === 'fr');
      document.getElementById('lang-en').classList.toggle('active', lang === 'en');
      try { localStorage.setItem('fd-lang', lang); } catch (e) {}
    }

    document.getElementById('lang-fr').addEventListener('click', () => setLang('fr'));
    document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

    let lang;
    try { lang = localStorage.getItem('fd-lang'); } catch (e) {}
    if (!lang) lang = (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en';
    setLang(lang);
  </script>

</body>
</html>
